<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أسئلة اليوم ١٢: تحدث - الرد المباشر والتسجيل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: { DEFAULT: '#FFF8F2', fill: '#FEF2E1', card: '#FFFFFF', hairline: '#ECE1D0' },
            ink: { DEFAULT: '#201B11', secondary: '#8C8C86' },
            teal: { DEFAULT: '#14545A', tint: '#E6F4F5' },
            coral: { DEFAULT: '#F56D4E', text: '#A9361D', tint: '#FFDAD2' },
            mustard: { DEFAULT: '#FEE263', border: '#E1C64A' },
            amber: { DEFAULT: '#E8A13A' },
            forest: { DEFAULT: '#1B5E20' }
          },
          fontFamily: {
            serif: ['Newsreader', 'serif'],
            sans: ['Noto Sans Arabic', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          },
          boxShadow: {
            warm: '0 4px 16px -2px rgba(32, 27, 17, 0.05)',
            coralPill: '0 4px 14px rgba(245, 109, 78, 0.35)',
            micPulse: '0 0 0 10px rgba(245, 109, 78, 0.15)'
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #FFF8F2; color: #201B11; -webkit-tap-highlight-color: transparent; }
    .pt-serif { font-family: 'Newsreader', serif; }
    .font-num { font-family: 'Inter', sans-serif; }
    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }
    .wave-bar { animation: wave 1s ease-in-out infinite; }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 m-0 bg-stone-100">
  <div class="w-[390px] h-[844px] bg-cream flex flex-col justify-between overflow-hidden relative shadow-2xl border border-cream-hairline">
    
    <!-- Top Bar -->
    <header class="pt-4 px-5 pb-3">
      <div class="flex items-center justify-between">
        <button class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-ink border border-cream-hairline hover:bg-cream-fill transition">
          <span class="material-symbols-rounded text-[20px]">close</span>
        </button>
        <div class="flex flex-col items-center">
          <span class="text-xs text-ink-secondary font-medium font-num">السؤال ٨ من ١٢</span>
          <span class="text-xs font-semibold text-teal font-num">أسئلة اليوم</span>
        </div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-coral-tint border border-coral/30 text-xs font-semibold text-coral-text">
          <span class="material-symbols-rounded text-[18px]">mic</span>
          <span>تحدث</span>
        </div>
      </div>
      <!-- Progress Bar -->
      <div class="w-full bg-[#EFE3D3] h-1.5 rounded-full mt-3 overflow-hidden">
        <div class="bg-coral h-full rounded-full transition-all duration-300" style="width: 66%;"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-5 flex flex-col justify-start gap-4 overflow-y-auto">
      <!-- Title -->
      <div class="text-right">
        <h1 class="text-[19px] font-bold text-teal leading-tight">رد عليها وعرف نفسك</h1>
        <p class="text-xs text-ink-secondary mt-0.5">استخدم صيغة Chamo-me في النطق البرتغالي السليم</p>
      </div>

      <!-- Situation Card with Character Avatar -->
      <div class="w-full bg-white rounded-[24px] p-4 border border-cream-hairline shadow-warm flex flex-col gap-3">
        <div class="flex items-start gap-3">
          <div class="relative w-14 h-14 rounded-full ring-2 ring-teal ring-offset-2 overflow-hidden flex-shrink-0 bg-cream-fill">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCr3Mue18Bc6FyEsikmM4uyV_kW3NFzjigvnJ8VwMrXx8wRXmXZ5JVJul0Zobi96BZKrQJh95gXUpOzwKoiTk4t8Tbyxc_gjSEwwTQ8byxKsrzTfx2rNJ_C6pynNOO5ja7rIvqsHEPkvLIKb9lxZlvtNgaj1DF0UPTLLSSo2yBLhwQhBr42soaZS2Y1pxouITHoqkCl7BLo6tcTVTV_u47Mr7X9X-mXJ0lfOb6R8hZ-" alt="إينيس" class="w-full h-full object-cover">
          </div>
          <div class="flex-1 text-right">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-teal">زميلة جديدة في الشغل (إينيس)</span>
              <span class="text-[11px] text-ink-secondary font-num">لشبونة</span>
            </div>
            <p class="text-xs text-ink-secondary mt-0.5">سألتك بابتسامة وهي بتتعرف عليك:</p>
          </div>
        </div>

        <!-- Speech Bubble of the Character -->
        <div class="w-full bg-teal-tint rounded-[18px] p-3.5 border border-teal/20 flex items-center justify-between gap-2" dir="ltr">
          <div class="flex items-center gap-3">
            <button class="w-9 h-9 rounded-full bg-teal text-white flex items-center justify-center shadow-sm flex-shrink-0 hover:scale-105 transition">
              <span class="material-symbols-rounded text-[20px]">volume_up</span>
            </button>
            <div class="text-left">
              <span class="pt-serif text-[19px] font-bold text-teal block leading-tight">«Como se chama?»</span>
              <span class="text-xs text-ink-secondary font-sans block" dir="rtl">«اسم حضرتك إيه؟»</span>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded-full bg-white/80 text-[10px] font-semibold text-teal border border-teal/20 font-num">سؤال</span>
        </div>
      </div>

      <!-- Active Recording Sub-State Pill Card -->
      <div class="w-full bg-white rounded-[24px] p-4 border border-coral/30 shadow-warm flex flex-col items-center gap-3 relative overflow-hidden">
        <div class="w-full flex items-center justify-between px-1">
          <div class="flex items-center gap-1.5 text-xs font-bold text-coral-text">
            <span class="w-2.5 h-2.5 rounded-full bg-coral animate-ping"></span>
            <span>جاري التسجيل الصوتي...</span>
          </div>
          <span class="font-num font-semibold text-xs text-ink bg-cream-fill px-2.5 py-0.5 rounded-full border border-cream-hairline">0:03</span>
        </div>

        <!-- Animated Audio Waveform -->
        <div class="flex items-center justify-center gap-1.5 h-10 w-full px-4">
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.1s;"></div>
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.3s;"></div>
          <div class="w-1 bg-teal rounded-full wave-bar" style="animation-delay: 0.2s;"></div>
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.5s;"></div>
          <div class="w-1 bg-teal rounded-full wave-bar" style="animation-delay: 0.15s;"></div>
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.4s;"></div>
          <div class="w-1 bg-teal rounded-full wave-bar" style="animation-delay: 0.25s;"></div>
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.35s;"></div>
          <div class="w-1 bg-teal rounded-full wave-bar" style="animation-delay: 0.1s;"></div>
          <div class="w-1 bg-coral rounded-full wave-bar" style="animation-delay: 0.45s;"></div>
        </div>

        <!-- Live Live Transcript Preview -->
        <div class="w-full bg-cream-fill rounded-xl py-2 px-3 text-center border border-cream-hairline" dir="ltr">
          <span class="text-xs text-ink-secondary block font-sans" dir="rtl">الكلام اللي اتلقط:</span>
          <span class="pt-serif text-[17px] font-semibold text-teal tracking-wide">«Chamo-me Omar»</span>
        </div>

        <!-- Stop / Cancel Controls Inside Pill -->
        <div class="flex items-center justify-center gap-4 w-full pt-1 border-t border-cream-hairline">
          <button class="text-xs text-ink-secondary hover:text-ink font-medium px-3 py-1">إلغاء</button>
          <span class="text-cream-hairline">•</span>
          <button class="text-xs text-teal font-bold px-3 py-1 flex items-center gap-1 hover:underline">
            <span>خلّصت كلام</span>
            <span class="material-symbols-rounded text-[16px]">done</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom Controls Area -->
    <footer class="px-5 pb-6 pt-3 flex flex-col items-center gap-3">
      <!-- Big Round Coral Mic Button -->
      <div class="flex items-center justify-center gap-5 w-full">
        <!-- Switch to Typing Button -->
        <button class="w-11 h-11 rounded-full bg-white border border-cream-hairline text-ink flex items-center justify-center hover:bg-cream-fill shadow-sm transition" title="اكتب بالكيبورد بدل التحدث">
          <span class="material-symbols-rounded text-[22px]">keyboard</span>
        </button>

        <!-- Big Mic -->
        <button class="w-18 h-18 w-[72px] h-[72px] rounded-full bg-coral text-white shadow-micPulse flex items-center justify-center active:scale-95 transition">
          <span class="material-symbols-rounded text-[34px]">mic</span>
        </button>

        <!-- Help / Hint Button -->
        <button class="w-11 h-11 rounded-full bg-white border border-cream-hairline text-ink flex items-center justify-center hover:bg-cream-fill shadow-sm transition" title="اسمع إجابة نموذجية">
          <span class="material-symbols-rounded text-[22px]">lightbulb</span>
        </button>
      </div>

      <!-- Silent Fallback Text Link -->
      <button class="text-xs text-ink-secondary hover:text-teal font-medium transition underline underline-offset-2">
        مش قادر أتكلم دلوقتي (التبديل للكتابة)
      </button>
    </footer>

  </div>
</body>
</html>
