<button aria-label="استمع للنطق البرتغالي" class="group relative w-16 h-16 rounded-full bg-secondary text-on-secondary flex items-center justify-center shadow-md active:scale-95 transition-transform duration-200 focus:outline-none" id="audio-button">
<span class="absolute inset-0 rounded-full bg-mint-accent opacity-0 group-hover:opacity-20 transition-opacity duration-300"></span>

<!-- 3 Option Picture Tiles (1:1 Ratio) -->
<div aria-label="خيارات الصور" class="w-full grid grid-cols-3 gap-2.5 mt-3" role="radiogroup">

<button aria-checked="false" class="quiz-option group flex flex-col items-center p-1.5 bg-surface-canvas rounded-2xl shadow-sm transition-all duration-200 active:scale-95 focus:outline-none hover:bg-surface-container-lowest" data-index="1" role="radio" type="button">

<img alt="فنجان قهوة كلاسيكي على طراز المقاهي في لشبونة" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida/ALJJyrDCFnOtXcTOaDQZUDRnqDVTqAjMiDLjQ65U5SqJciD_C6j1jFTklE-K0a66NKoCXamiX5M8D0khAE96ruiMtVX_UMVW2VEaz2UF2YwQOSOASDFvsh66nQJmvqspGygixoCZ8EvPxQdnC1622Co_lcnQLxaCH6vk3gBM0MxmTKeCyXVqlSDm1_07P5N12ld0iNED0K2YwvYcS3srLI3Vx24Rd5E38JNX4joYKoq3rIJ--w"/>
<div class="selection-check absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center opacity-0 scale-75 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined text-[13px] font-bold">check</span>
</div>
</div>
<span class="mt-2 font-label-md text-label-md text-on-surface-variant group-hover:text-secondary transition-colors">الخيار ١</span>
</button>
<!-- Option 2: Water -->
<button aria-checked="false" class="quiz-option group flex flex-col items-center p-1.5 bg-surface-canvas rounded-2xl shadow-sm transition-all duration-200 active:scale-95 focus:outline-none hover:bg-surface-container-lowest" data-index="2" role="radio" type="button">

<div class="selection-check absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center opacity-0 scale-75 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined text-[13px] font-bold">check</span>
</div>
</div>
<span class="mt-2 font-label-md text-label-md text-on-surface-variant group-hover:text-secondary transition-colors">الخيار ٢</span>
</button>
<!-- Option 3: Milk -->
<button aria-checked="false" class="quiz-option group flex flex-col items-center p-1.5 bg-surface-canvas rounded-2xl shadow-sm transition-all duration-200 active:scale-95 focus:outline-none hover:bg-surface-container-lowest" data-index="3" role="radio" type="button">
<div class="w-full aspect-square rounded-xl overflow-hidden bg-surface-container-high relative">

<div class="selection-check absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-secondary text-on-secondary flex items-center justify-center opacity-0 scale-75 transition-all duration-200 shadow-sm">
<span class="material-symbols-outlined text-[13px] font-bold">check</span>
</div>
</div>
<span class="mt-2 font-label-md text-label-md text-on-surface-variant group-hover:text-secondary transition-colors">الخيار ٣</span>
</button>

<!-- Coach Tip Card -->
<div class="w-full mt-4 bg-tip-amber-surface rounded-xl p-3 flex items-start gap-2.5">

<div class="flex flex-col">
<span class="font-label-md text-label-md text-tip-amber-text font-bold">ملاحظة لغوية سريعة</span>
<p class="font-body-sm text-body-sm text-primary-container leading-tight mt-0.5">
            في البرتغال، نطق الحروف المتحركة أهدى ومقفول مقارنةً بالبرازيل. ركّز في نبرة الصوت!
          </p>
</div>
</div>
<!-- Skip Action Link -->
<button class="mt-4 text-center font-body-sm text-body-sm text-slate-muted hover:text-secondary transition-colors" type="button">
        تخطّى هذا السؤال
      </button>
</div>
</main>
<!-- Sticky Action Console -->
<footer class="w-full px-margin-mobile pt-4 pb-2 mt-auto">

        السابق
      </button>
<!-- Next / Confirm Button (Disabled by default, switches on selection) -->
<button class="h-12 flex-1 rounded-full bg-surface-container-low text-slate-muted cursor-not-allowed font-label-lg text-label-lg shadow-none flex items-center justify-center gap-1.5 transition-all duration-200" disabled="" id="submit-button" type="button">
<span>التالي</span>
<span class="material-symbols-outlined text-[18px] rotate-180">arrow_right_alt</span>
</button>
</div>
</footer>
</div>
<script>
  (function() {
    const audioBtn = document.getElementById('audio-button');
    const audioWave = document.getElementById('audio-wave');
    const options = document.querySelectorAll('.quiz-option');
    const nextBtn = document.getElementById('submit-button');

    // Audio Play Delight micro-interaction
    audioBtn.addEventListener('click', () => {
      audioWave.classList.remove('opacity-0');
      audioWave.classList.add('opacity-100');
      setTimeout(() => {
        audioWave.classList.remove('opacity-100');
        audioWave.classList.add('opacity-0');
      }, 900);
    });

    // Option Tile Selection logic
    options.forEach(option => {
      option.addEventListener('click', () => {
        options.forEach(opt => {
          opt.setAttribute('aria-checked', 'false');
          opt.classList.remove('bg-surface-container', 'shadow-md');
          opt.classList.add('bg-surface-canvas');
          const check = opt.querySelector('.selection-check');
          if (check) {
            check.classList.add('opacity-0', 'scale-75');
            check.classList.remove('opacity-100', 'scale-100');
          }
        });

        // Set selected active state
        option.setAttribute('aria-checked', 'true');
        option.classList.remove('bg-surface-canvas');
        option.classList.add('bg-surface-container', 'shadow-md');
        const activeCheck = option.querySelector('.selection-check');
        if (activeCheck) {
          activeCheck.classList.remove('opacity-0', 'scale-75');
          activeCheck.classList.add('opacity-100', 'scale-100');
        }

        // Enable Next Button with mint-action brand glow
        nextBtn.removeAttribute('disabled');
        nextBtn.classList.remove('bg-surface-container-low', 'text-slate-muted', 'cursor-not-allowed', 'shadow-none');
        nextBtn.classList.add('bg-mint-action', 'text-primary-container', 'shadow-md', 'hover:bg-mint-accent', 'active:scale-95');
      });
    });
  })();
</script></main></body></html>
