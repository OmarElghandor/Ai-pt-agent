<script>
  let isShiftActive = false;
  const typedEl = document.getElementById('typed-text');
  const countEl = document.getElementById('char-count');

  function updateCount() {
    const len = typedEl.textContent.length;
    countEl.textContent = `${len} حرف`;
  }

  function insertChar(char) {
    if (char === '123') return;
    const finalChar = isShiftActive ? char.toUpperCase() : char;
    typedEl.textContent += finalChar;
    updateCount();
    if (isShiftActive) toggleShift();
  }

  function deleteChar() {
    typedEl.textContent = typedEl.textContent.slice(0, -1);
    updateCount();
  }

  function toggleShift() {
    isShiftActive = !isShiftActive;
    const shiftBtn = document.getElementById('shift-key');
    if (isShiftActive) {
      shiftBtn.classList.add('bg-primary', 'text-on-primary');
      shiftBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
    } else {
      shiftBtn.classList.remove('bg-primary', 'text-on-primary');
      shiftBtn.classList.add('bg-surface-variant', 'text-on-surface-variant');
    }
  }

  document.getElementById('clear-text-btn')?.addEventListener('click', () => {
    typedEl.textContent = '';
    updateCount();
  });

  document.getElementById('main-play-btn')?.addEventListener('click', function() {
    this.classList.add('scale-95');
    setTimeout(() => this.classList.remove('scale-95'), 180);
  });

  document.getElementById('slow-play-btn')?.addEventListener('click', function() {
    this.classList.toggle('bg-primary');
    this.classList.toggle('text-on-primary');
  });

  document.getElementById('submit-btn')?.addEventListener('click', function() {
    this.classList.add('opacity-80');
    setTimeout(() => this.classList.remove('opacity-80'), 200);
  });
