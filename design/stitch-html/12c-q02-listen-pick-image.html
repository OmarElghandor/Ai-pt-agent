      اضغط على زر الصوت عشان تسمع الكلمة بوضوح

</div>
<!-- Audio Playback Control Module -->
<div class="bg-surface-container-low rounded-xl p-4 mb-6 shadow-sm flex items-center justify-between">
<div class="flex items-center gap-3">
<!-- Main Audio Play Trigger -->
<button aria-label="تشغيل الصوت" class="w-14 h-14 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-md active:scale-95 transition-transform" id="play-normal">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
<!-- Waveform Visual Representation -->
<div aria-hidden="true" class="flex items-center gap-1 h-8 px-2">
<span class="w-1 bg-primary/40 rounded-full h-3"></span>
<span class="w-1 bg-primary/60 rounded-full h-5"></span>
<span class="w-1 bg-primary rounded-full h-7"></span>
<span class="w-1 bg-primary/80 rounded-full h-4"></span>
<span class="w-1 bg-primary/40 rounded-full h-6"></span>
<span class="w-1 bg-primary/70 rounded-full h-3"></span>
</div>
</div>
<!-- Slow Mode Play Trigger -->
<button aria-label="تشغيل ببطء" class="flex items-center gap-1.5 bg-surface px-3 py-2 rounded-full shadow-sm text-primary hover:bg-surface-container transition-colors active:scale-95" id="play-slow">
<span class="material-symbols-outlined text-[20px]">pace</span>
<span class="font-label-md text-label-md font-semibold">بطيء</span>
</button>
</div>
<!-- 2x2 Picture Selection Grid -->
<div aria-label="خيارات الصور" class="grid grid-cols-2 gap-3 mb-8" role="radiogroup">
<!-- Option 1: Bread -->
<div aria-checked="false" class="option-card aspect-square bg-surface rounded-xl p-2.5 flex items-center justify-center shadow-sm cursor-pointer transition-all duration-200" role="radio" tabindex="0">

</div>
</div>
<!-- Option 2: Cheese (Selected State) -->
<div aria-checked="true" class="option-card aspect-square bg-primary-fixed/20 rounded-xl p-2.5 flex items-center justify-center shadow-md shadow-primary/5 cursor-pointer transition-all duration-200 ring-2 ring-primary" role="radio" tabindex="0">
<div class="w-full h-full rounded-lg overflow-hidden bg-surface-container-high flex items-center justify-center relative">
<img class="w-full h-full object-cover" data-alt="Warm editorial storybook gouache illustration of a golden triangular wedge of Portuguese cured cheese with delicate holes on a clean warm cream background, tactile gentle shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAuGy2PZUea_WCqTjg-__1AP7fSbOD9UDX9IrmH6KIaES_nmHf_koqQlDnpE3O2plaM2U3v0w4q2hYhe1DxKvd5G4J3b-ZCD75GgXHCUhHtS7rH6bbdJ9wyf5VM5HndctzdDCs56GqtBnODn_bRvlIIsTFLGdj5Rn4ue5DmkBcgykXrH2oqX6WmCk7tYWjnWEeOJOQ_nzfnUbumxtZIfKhRiCNrckQ5LeH6xKUdyAjm"/>
<div class="absolute top-2 right-2 w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</div>
</div>
<!-- Option 3: Apple -->
<div aria-checked="false" class="option-card aspect-square bg-surface rounded-xl p-2.5 flex items-center justify-center shadow-sm cursor-pointer transition-all duration-200" role="radio" tabindex="0">
<div class="w-full h-full rounded-lg overflow-hidden bg-surface-container-high flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="Warm editorial storybook gouache illustration of a fresh crisp red apple with a tiny green leaf on a light cream background, warm soft lighting and hand-drawn charm." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCcd_MnbD_UGZFOFuViKgwcHy4xEVlgiJ2OD_UoVM2K1bLWiqPup_Lb9rS-7kUKNez1yguqYU5DOuDDb9VGkDn5INM8cHhKp4TJYAAZf3zr9f1jpo6Xjleu7fFtfo90a7nbB3I0ncovZucYSSs1B-Xgr1Y7MU0vVtrRUicH2HgyBKETFwP6Wkv3AOR7iG9SxgRvQ3BpMa-cifv5vtDgYzU26Q3q7btZYMRuTjwrvB8s"/>
</div>
</div>
<!-- Option 4: Egg -->
<div aria-checked="false" class="option-card aspect-square bg-surface rounded-xl p-2.5 flex items-center justify-center shadow-sm cursor-pointer transition-all duration-200" role="radio" tabindex="0">
<div class="w-full h-full rounded-lg overflow-hidden bg-surface-container-high flex items-center justify-center">
<img class="w-full h-full object-cover" data-alt="Warm editorial storybook gouache illustration of a farm-fresh brown egg nestled on soft warm cream background, subtle texture, cozy minimalist morning mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBjXZ5NrZ3-ZE4sd6zozSn7ZxQhD-iQmqqZeqYlZpEjbrZc_5R1_tH8glh0VnLGpYkdmgMewGzArZpm-ohqpxl4lPKoiiPY01_oBA7Emi9yUIXM-UvuSzbFdSit7wppGlqXAAHd5on_eMx-V645trhtWzbZYZ9YK9UcLN44y123JxVZFbmh292Wmo0eUsWcmtShAHHe_6nZoX0wHgaWQqaiYyxygk6B-IVZFaCU2krq"/>
</div>
</div>
</div>
<!-- Confirmation Sticky Action -->
<div class="w-full mt-auto pt-2 pb-4">
<button class="w-full py-4 rounded-full bg-secondary-container text-on-secondary font-label-lg text-label-lg font-bold shadow-[0_8px_20px_rgba(254,115,84,0.35)] active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="button">
<span>تأكيد</span>
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
</div>
</div>
<script>
  // Selection Micro-interaction
  document.querySelectorAll('.option-card').forEach((card) => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.option-card').forEach((c) => {
        c.setAttribute('aria-checked', 'false');
        c.className = 'option-card aspect-square bg-surface rounded-xl p-2.5 flex items-center justify-center shadow-sm cursor-pointer transition-all duration-200';
        const badge = c.querySelector('.absolute');
        if (badge) badge.remove();
      });

      card.setAttribute('aria-checked', 'true');
      card.className = 'option-card aspect-square bg-primary-fixed/20 rounded-xl p-2.5 flex items-center justify-center shadow-md shadow-primary/5 cursor-pointer transition-all duration-200 ring-2 ring-primary';
      
      const container = card.querySelector('div');
      if (!container.querySelector('.absolute')) {
        const check = document.createElement('div');
        check.className = 'absolute top-2 right-2 w-6 h-6 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm';
        check.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
        container.appendChild(check);
      }
    });
  });

  // Sound Pulse Micro-interaction
  const playBtn = document.getElementById('play-normal');
  if (playBtn) {
    playBtn.addEventListener('click', function() {
      this.classList.add('scale-105');
      setTimeout(() => this.classList.remove('scale-105'), 200);
    });
  }
</script></main></body></html>
