<script>
  (function () {
    const input = document.getElementById('pt-sentence-input');
    const accentKeys = document.querySelectorAll('.accent-key');
    accentKeys.forEach((btn) => {
      btn.addEventListener('click', () => {
        const char = btn.getAttribute('data-char') || '';
        const start = input.selectionStart || input.value.length;
        const end = input.selectionEnd || input.value.length;
        input.value = input.value.slice(0, start) + char + input.value.slice(end);
        input.focus();
        input.setSelectionRange(start + char.length, start + char.length);
      });
    });

    const playBtn = document.getElementById('audio-play-btn');
    const bars = document.querySelectorAll('#waveform-bars span');
    let playing = false;
    let intervalId = null;

    if (playBtn) {
      playBtn.addEventListener('click', () => {
        playing = !playing;
        const icon = playBtn.querySelector('.material-symbols-outlined');
        icon.textContent = playing ? 'pause' : 'play_arrow';
        if (playing) {
          intervalId = setInterval(() => {
            bars.forEach((bar) => {
              const h = Math.floor(Math.random() * 22) + 8;
              bar.style.height = h + 'px';
            });
          }, 180);
        } else {
          clearInterval(intervalId);
        }
      });
    }

    const voiceBtn = document.getElementById('voice-variant-btn');
    let recording = false;
    if (voiceBtn) {
      voiceBtn.addEventListener('click', () => {
        recording = !recording;
        voiceBtn.classList.toggle('bg-tertiary', recording);
        voiceBtn.classList.toggle('bg-primary', !recording);
      });
    }
  })();
</script></main>
