<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_stack" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&amp;family=Work+Sans:wght@500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "on-secondary-fixed": "#00174c", "on-secondary-container": "#002670", "surface-bright": "#fdf9f0", "outline": "#767681", "surface-dim": "#dddad1", "on-error-container": "#93000a", "primary-container": "#12235a", "on-surface-variant": "#454650", "on-error": "#ffffff", "on-tertiary-fixed": "#211b06", "on-primary": "#ffffff", "primary-fixed": "#dce1ff", "surface-container-low": "#f7f3ea", "error": "#ba1a1a", "surface-variant": "#e6e2d9", "outline-variant": "#c6c5d1", "on-tertiary": "#ffffff", "tertiary-fixed-dim": "#d1c6a4", "surface-container-highest": "#e6e2d9", "inverse-on-surface": "#f4f0e7", "background": "#fdf9f0", "error-container": "#ffdad6", "secondary-container": "#678dff", "surface": "#fdf9f0", "on-tertiary-fixed-variant": "#4e472d", "surface-container-lowest": "#ffffff", "on-primary-fixed-variant": "#34437b", "secondary": "#2956c6", "on-background": "#1c1c17", "secondary-fixed-dim": "#b4c5ff", "on-primary-fixed": "#02164e", "primary-fixed-dim": "#b7c4ff", "inverse-primary": "#b7c4ff", "on-surface": "#1c1c17", "tertiary": "#171201", "on-secondary-fixed-variant": "#003daa", "tertiary-container": "#2d2710", "tertiary-fixed": "#eee2bf", "surface-tint": "#4c5b95", "primary": "#000e3d", "on-primary-container": "#7d8cc9", "on-secondary": "#ffffff", "surface-container-high": "#ece8df", "surface-container": "#f1eee5", "on-tertiary-container": "#978e6f", "inverse-surface": "#31312b", "secondary-fixed": "#dbe1ff" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-2xl": "3rem", "space-sm": "0.5rem", "gutter-sm": "0.75rem", "gutter": "1rem", "space-xs": "0.25rem", "margin-tablet": "2rem", "space-md": "1rem", "gutter-lg": "1.5rem", "margin": "1rem", "space-xl": "2rem", "space-lg": "1.5rem" }, fontFamily: { "body-lg": ["Newsreader"], "title-md": ["Work Sans"], "label-md": ["Work Sans"], "headline-lg-mobile": ["Barlow Condensed"], "headline-md": ["Barlow Condensed"], "phonetic-md": ["Newsreader"], "body-sm": ["Newsreader"], "headline-xl": ["Barlow Condensed"], "label-sm": ["Work Sans"], "headline-lg": ["Barlow Condensed"], "body-md": ["Newsreader"], "headline-xl-mobile": ["Barlow Condensed"] }, fontSize: { "body-lg": ["19px", { "lineHeight": "28px", "fontWeight": "400" }], "title-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-lg-mobile": ["24px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "26px", "fontWeight": "600" }], "phonetic-md": ["15px", { "lineHeight": "20px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-xl": ["40px", { "lineHeight": "44px", "fontWeight": "700" }], "label-sm": ["11px", { "lineHeight": "14px", "fontWeight": "600" }], "headline-lg": ["30px", { "lineHeight": "34px", "fontWeight": "600" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-xl-mobile": ["32px", { "lineHeight": "36px", "fontWeight": "700" }] } } } }</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-secondary-fixed"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="الرجوع" class="w-11 h-11 flex items-center justify-center rounded-lg text-primary hover:bg-surface-variant transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_forward</span></button><h1 class="font-title-md text-title-md text-primary tracking-tight">Flashcard Review</h1></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full flex-1 px-margin pt-16 pb-safe bg-surface"><div class="flex flex-col w-full py-space-sm pb-space-lg select-none">
<!-- Top Session Bar: Notebook Index & Subtle Linear Progress -->
<header class="flex flex-col gap-space-xs mb-space-md">
<div class="flex items-center justify-between text-on-surface-variant font-label-md text-label-md">
<div class="flex items-center gap-space-xs">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-semibold text-primary">مراجعة النهارده</span>
<span class="text-outline">·</span>
<span class="text-on-surface tracking-wide">٧ / ١٥</span>
</div>
<div class="flex items-center gap-1 text-outline">
<span class="material-symbols-outlined text-[16px]">menu_book</span>
<span class="font-label-sm text-label-sm">دفتر الأفعال</span>
</div>
</div>
<!-- Editorial Notebook Rule Progress Bar -->
<div class="relative w-full h-[6px] bg-surface-container-high rounded-full overflow-hidden">
<div class="absolute right-0 top-0 bottom-0 bg-primary-container rounded-full transition-all duration-500 ease-out" style="width: 47%;"></div>
</div>
</header>
<!-- Main Focus Container: Retrieval Flashcard -->
<main class="w-full flex flex-col items-center">
<!-- Tactile Flashcard Leaf -->
<article class="relative w-full bg-surface-container-lowest rounded-3xl p-space-lg flex flex-col justify-between items-center min-h-[380px] shadow-[0_8px_24px_rgba(18,35,90,0.06),0_2px_4px_rgba(18,35,90,0.04)] transition-transform duration-200 active:scale-[0.995]" id="flashcard" style="box-shadow: 0 0 0 2px #1E7E44, 0 10px 28px -4px rgba(30, 126, 68, 0.12);">
<!-- Top Meta Badge: Verbo Pill -->
<div class="w-full flex items-center justify-between">
<span class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-label-sm font-label-sm font-semibold tracking-wider bg-surface-container-low text-[#1E7E44] border-0">
<span class="w-1.5 h-1.5 rounded-full bg-[#1E7E44]"></span>
          VERBO
        </span>
<span class="text-outline-variant font-label-sm text-label-sm tracking-widest uppercase">A1 · 04</span>
</div>
<!-- Dead Center: Pure Retrieval Target Word (NO translation, NO phonetics) -->
<div class="flex flex-col items-center justify-center my-auto py-space-md">
<h2 class="font-headline-xl text-headline-xl tracking-tight text-[#1E7E44] select-text font-bold mb-space-md text-center" dir="ltr">
          DORMIR
        </h2>
<!-- Tactile Acoustic Prompts (Audio Controls) -->
<div class="flex items-center justify-center gap-space-md pt-space-xs" dir="ltr">
<!-- Primary Audio Exemplar -->
<button aria-label="استمع للنطق الطبيعي" class="group flex items-center gap-space-xs bg-surface-container-low hover:bg-surface-container text-primary font-label-md text-label-md px-space-md py-2 rounded-full transition-all active:scale-95 shadow-sm" id="audio-regular" type="button">
<span class="w-7 h-7 rounded-full bg-primary-container text-on-primary flex items-center justify-center group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[17px]">volume_up</span>
</span>
<span class="font-title-md text-title-md pr-1" dir="rtl">اسمع</span>
</button>
<!-- Secondary Slow Turtle Playback -->
<button aria-label="استمع بالنطق البطيء" class="group flex items-center gap-1 bg-surface-container-lowest hover:bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm px-3 py-2 rounded-full transition-all active:scale-95 shadow-sm" id="audio-slow" type="button">
<span class="w-6 h-6 rounded-full bg-surface-container-high text-on-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[15px]">slow_motion_video</span>
</span>
<span class="font-label-sm text-label-sm" dir="rtl">ببطء</span>
</button>
</div><div class="mt-space-md px-space-md py-2.5 rounded-xl border border-amber-200/80 bg-[#fef9c3]/60 flex items-center justify-center gap-2 select-text shadow-sm" dir="ltr"><span class="material-symbols-outlined text-[18px] text-on-surface-variant">volume_up</span><p class="font-body-md text-[17px] text-on-surface tracking-wide">A que horas <span class="font-bold text-[#1E7E44]">dormes</span>?</p></div>
</div>
<!-- Bottom Edge: Discreet Cognitive Retrieval Cue -->
<footer class="w-full pt-space-sm flex items-center justify-center">
<p class="font-body-sm text-body-sm text-outline text-center">
          فاكر معناها؟ قولها في سرّك واقلب
        </p>
</footer>
</article>
</main>
<!-- Interactive Action Deck -->
<section class="w-full flex flex-col items-center mt-space-lg gap-space-md">
<!-- Primary Flip Trigger: Stamp Press Elevation -->
<button class="w-full h-14 bg-primary-container text-on-primary rounded-xl flex items-center justify-center gap-space-sm font-title-md text-title-md shadow-[0_4px_12px_rgba(18,35,90,0.18)] hover:bg-primary active:translate-y-0.5 active:shadow-none transition-all" id="btn-flip" type="button">
<span>اقلب البطاقة</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:rotate-180">flip</span>
</button>
<!-- Subtle Hint Link -->
<div class="inline-flex items-center gap-1 text-outline py-1 px-2 font-label-sm text-label-sm select-none" id="btn-hint"><span class="material-symbols-outlined text-[16px] text-outline">check_circle</span><span class="">استخدمت تلميح</span></div>
<!-- Collapsible Contextual Hint (Notebook Note) -->

</section>
</div>
<script>
  // Minimal micro-interactions for auditory feedback and hint disclosure
  const hintBtn = document.getElementById('btn-hint');
  const hintDrawer = document.getElementById('hint-drawer');
  const audioRegular = document.getElementById('audio-regular');
  const audioSlow = document.getElementById('audio-slow');
  const flipBtn = document.getElementById('btn-flip');
  const flashcard = document.getElementById('flashcard');

  hintBtn.addEventListener('click', () => {
    hintDrawer.classList.toggle('hidden');
    hintBtn.classList.toggle('text-primary');
  });

  const playSpeech = (rate = 1.0) => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance('Dormir');
      utterance.lang = 'pt-PT';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    }
  };

  audioRegular.addEventListener('click', () => playSpeech(1.0));
  audioSlow.addEventListener('click', () => playSpeech(0.65));

  // Tactile flip trigger anticipation
  flipBtn.addEventListener('click', () => {
    flashcard.style.transform = 'scale(0.97) rotateY(12deg)';
    setTimeout(() => {
      flashcard.style.transform = '';
    }, 180);
  });
</script></main>

</body></html>
